name: Publish

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false

      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis'

          - os: ubuntu-22.04
            args: '--bundles appimage'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          fi

          if [ -z "$TAG" ]; then
            echo "ERROR: No v* tag found"
            exit 1
          fi

          echo "Publishing tag: $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build and publish Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

        with:
          tagName: ${{ env.TAG }}
          releaseName: ${{ env.TAG }}
          releaseDraft: false
          prerelease: false

          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

          args: ${{ matrix.args }}